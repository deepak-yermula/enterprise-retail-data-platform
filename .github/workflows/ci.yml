name: Retail capstone CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q retail_pipeline tests azure/databricks
      - name: Run integration and quality tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: |
          python -m retail_pipeline.cli demo --db output/retail.db --out output/gold
          python -m retail_pipeline.cli summary --db output/retail.db
